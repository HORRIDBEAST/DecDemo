ext {
    minSdkVersion = 23
    compileSdkVersion = 35
    // Android 15's forced edge-to-edge layout (status bar/camera-cutout overlap) only
    // applies to apps that TARGET API 35+. Neither the manifest opt-out flag nor the
    // StatusBar plugin's setOverlaysWebView(false) reliably suppressed it on this
    // device's MIUI/HyperOS build, so targeting 34 avoids the enforcement outright.
    // compileSdkVersion stays 35 - that only affects which APIs are available to
    // compile against, not this runtime behavior.
    targetSdkVersion = 34
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}